apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: portfolio
resources:
  - ../../base
  - ingress.yaml
images:
  # Point this at the registry your cluster can pull from and pin a git SHA as
  # the tag. `scripts/k8s-deploy.sh` reads the resolved reference from here.
  - name: ghcr.io/digitalcovet/portfolio-digital-covet
    newTag: latest
patches:
  - path: configmap-patch.yaml

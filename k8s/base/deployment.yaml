# Stateless web replicas: sessions are cookie-based, rate limiting and share
# unlock attempts live in Postgres, and uploads go to Supabase Object Storage.
# Scale `replicas` freely.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio
  labels:
    app.kubernetes.io/name: portfolio
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: digital-covet
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: portfolio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portfolio
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: digital-covet
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      # If the registry is private, create a pull secret and reference it here:
      # imagePullSecrets:
      #   - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: portfolio
      containers:
        - name: portfolio
          # The production overlay rewrites the tag; keep an immutable tag
          # (git SHA) there instead of moving `latest` around.
          image: ghcr.io/digitalcovet/portfolio-digital-covet:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3333
              protocol: TCP
          envFrom:
            - configMapRef:
                name: portfolio-config
            - secretRef:
                name: portfolio-env
          # /health is public and dependency-free, so a Postgres or storage
          # outage never restarts a healthy process.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ['sh', '-c', 'sleep 5']
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: '1'
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']
          volumeMounts:
            # AdonisJS stages uploads in tmp/ before forwarding them.
            - name: app-tmp
              mountPath: /app/tmp
            - name: pod-tmp
              mountPath: /tmp
      volumes:
        - name: app-tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: pod-tmp
          emptyDir:
            sizeLimit: 64Mi
